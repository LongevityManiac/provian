[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
# Compiler settings match hardhat.config.ts for the live contract sources.
via_ir = true
optimizer = true
optimizer_runs = 200
# Read-only runtime configuration for fork proofs.
fs_permissions = [
  { access = "read", path = "./deployments/base-pvt9-institutions.json" },
  { access = "read", path = "../config/pvt9-base.json" },
]

# Fuzz testing config
[fuzz]
runs = 1000
max_test_rejects = 100000

# Invariant testing config
[invariant]
runs = 256
depth = 50
fail_on_revert = false
