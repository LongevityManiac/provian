- takeScreenshot: screenshots/nav-audit/consent-1tap

# Row 2: Terms - ~60px below
- tapOn:
    point: "150,510"
- takeScreenshot: screenshots/nav-audit/consent-2tap

# Row 3: Age - ~60px below
- tapOn:
    point: "150,570"
- takeScreenshot: screenshots/nav-audit/consent-3tap

# Create My Wallet button
- tapOn:
    point: "201,760"
- waitForAnimationToEnd
- takeScreenshot: screenshots/nav-audit/consent-after-create
