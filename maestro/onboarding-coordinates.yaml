appId: com.provian.wallet
---
# Provian Onboarding - Tap through by coordinates
# iPhone 17 Pro: 402x874 (Maestro points)
# "Show Me" button is approximately at y=780, centered at x=201

# Step 1: Hook
- takeScreenshot: screenshots/onboarding-01-hook
- tapOn:
    point: "201,780"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*"
    timeout: 3000

