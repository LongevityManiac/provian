- waitForAnimationToEnd

# Step 3: PE
- takeScreenshot: screenshots/onboarding-03-pe
- tapOn: "Show Me"
- waitForAnimationToEnd

# Step 4: PVT
- takeScreenshot: screenshots/onboarding-04-pvt
- tapOn: "Show Me"
- waitForAnimationToEnd

# Step 5: Agents
- takeScreenshot: screenshots/onboarding-05-agents
- tapOn: "Show Me"
- waitForAnimationToEnd

# Step 6: Wallet Features
- takeScreenshot: screenshots/onboarding-06-wallet
- tapOn: "Show Me"
- waitForAnimationToEnd

# Step 7: Promises
- takeScreenshot: screenshots/onboarding-07-promises
- tapOn: "Show Me"
- waitForAnimationToEnd

# Step 8: Commons
- takeScreenshot: screenshots/onboarding-08-commons
