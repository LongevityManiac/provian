name: Build & Publish @provian packages (npm + PyPI)

# Builds the desktop foreground-capture helper binaries for @provian/agent-sdk
# on their native GitHub-hosted runners, then packs + (optionally) publishes the
# SDK, @provian/cli, @provian/mcp and @provian/commons to npm — all authenticated by the
# NPM_TOKEN secret, so publishing never needs an interactive local npm login or
# a per-publish OTP. This is what lets the flip run §3 unattended.
#
# It also packs + (optionally) publishes the Python SDK (`provian-sdk`) to PyPI.
# The PyPI publish uses OIDC Trusted Publishing (pypa/gh-action-pypi-publish), so
# it needs NO token and NO stored secret: the publish-pypi job authenticates with
# a short-lived OIDC token minted from GitHub (permissions: id-token: write) and
# gated by the `pypi-publish` GitHub environment. PyPI's pending-publisher flow
# accepts a first publish of a brand-new project name this way, so — unlike npm —
# nothing needs to exist on PyPI or in a secret store before the flip.
#
# Why this exists:
#   - The LLMSessionPlugin (ai_conversation desktop capture) spawns a native
#     helper binary at runtime. End users never compile it - npm postinstall
#     only COPIES a prebuilt binary from bin/helpers/<platform>/. So the
#     binaries must be built and bundled BEFORE the SDK is published.
#   - The macOS helper is Swift; the Windows helper is C#/.NET targeting
#     net8.0-windows. The Windows binary CANNOT be built on macOS/Linux - it
#     needs a Windows host. This workflow's windows-latest runner is that
#     host, so no physical PC is required. The job can be triggered from
#     anywhere (including the GitHub mobile app / browser) via "Run workflow".
#   - @provian/cli and @provian/mcp have no native binaries, but a bare local
#     `npm publish` still needs an interactive login + OTP (or refuses without
#     2FA enrollment). Their equivalent "don't ship it broken" hazard is a
#     stale/missing gitignored dist/ — so their jobs ALWAYS rebuild dist/ from
#     source and then verify dist/ + the bin file are inside the packed tarball.
#     Like the SDK job, they run NO vitest in CI: the cli/mcp suites run in the
#     manual §2 pre-publish gate (mcp's vite/oxc transform can't resolve its
#     test-excluding tsconfig on the Linux CI runner; it passes locally).
#     The CLI additionally builds against the in-repo agent-sdk (its ^ dep is
#     not on npm at pack time); --no-save keeps the published ^ range intact.
#
# Inputs (workflow_dispatch):
#   publish   - false (default): build/pack/verify only, publish NOTHING.
#               true: publish the selected package(s) — npm via NPM_TOKEN,
#               PyPI via OIDC trusted publishing (no token).
#   packages  - which package(s) a publish targets. Default 'agent-sdk' keeps
#               the historical `-f publish=true` meaning (SDK only) intact.
#               'pypi' targets the Python SDK (provian-sdk) on PyPI alone.
#               'all' publishes agent-sdk -> cli -> mcp -> commons -> pypi in that order
#               (the CLI's published ^ dep on the SDK resolves for end users only
#               once the SDK is live, so the SDK must hit npm first; @provian/commons
#               (the Commons reference package: its README and licence, no code) and
#               the PyPI package are independent and publish last, matching the
#               launch runbook's locked order).
#
# What it does NOT do by default: publish. PR runs and default manual runs
# build + pack + verify only - nothing ships. Publishing needs a manual run
# with publish=true AND the NPM_TOKEN secret AND (if you add a protection rule)
# approval on the `npm-publish` environment.
#
# Signing note: this produces UNSIGNED dev binaries. macOS notarization and
# Windows Authenticode signing are the separate pre-beta release workflow
# (see OPEN_ITEMS.md). Unsigned helpers run fine when spawned with piped
# stdio by the observer; signing matters for interactive-launch reputation.

on:
  # Build (no publish) whenever helper sources or packaging change, so a
  # compile break - especially in the C# helper, which can't be built on the
  # Mac/Linux dev machines - is caught in CI.
  # SOLO-DEVELOPER CI SHAPE (2026-09-06): no push trigger (never had one) and
  # deliberately NO nightly schedule — this builds native macOS (billed 10x) and
  # Windows helpers and publishes packages; a nightly would add real cost with no
  # standing-safety value. It stays PR-on-native-change + manual dispatch.
  pull_request:
    branches: [master]
    paths:
      - 'provian-agent-sdk/native/**'
      - 'provian-agent-sdk/scripts/postinstall-helper.js'
      - 'provian-agent-sdk/package.json'
      - '.github/workflows/build-foreground-helpers.yml'
  # Manual trigger. Set publish=true to publish to npm (requires NPM_TOKEN).
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the selected package(s) after building (npm via NPM_TOKEN; PyPI via OIDC trusted publishing)'
        type: boolean
        default: false
      packages:
        description: 'Which package(s) a publish=true run targets'
        type: choice
        default: 'agent-sdk'
        options:
          - agent-sdk
          - cli
          - mcp
          - commons
          - pypi
          - all

concurrency:
  group: build-foreground-helpers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- macOS helper (Swift) -------------------------------------------
  build-macos:
    name: Build macOS helper
    runs-on: macos-latest
    timeout-minutes: 10  # observed max 0.9 min (2 runs, Aug 2026); thin history -> +5; 3x headroom, rounded up to 5
    # Only needed for the SDK. Always on PRs (the C# helper compile guard).
    if: ${{ github.event_name == 'pull_request' || inputs.packages == 'agent-sdk' || inputs.packages == 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build helper (build.sh → .app, ad-hoc signed)
        working-directory: provian-agent-sdk/native/darwin/foreground-helper
        run: ./build.sh

      - name: Stage into bin/helpers/darwin
        working-directory: provian-agent-sdk
        run: |
          mkdir -p bin/helpers/darwin
          cp -R native/darwin/foreground-helper/ProvianForegroundHelper.app bin/helpers/darwin/

      # Tar to preserve the .app bundle structure, executable bit, and the
      # ad-hoc signature (upload-artifact alone does not preserve these).
      - name: Tar the .app bundle
        working-directory: provian-agent-sdk/bin/helpers/darwin
        run: tar -cf darwin-helper.tar ProvianForegroundHelper.app

      - name: Upload macOS helper artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foreground-helper-darwin
          path: provian-agent-sdk/bin/helpers/darwin/darwin-helper.tar
          if-no-files-found: error
          retention-days: 7

  # ---- Windows helper (C# / .NET) -------------------------------------
  build-windows:
    name: Build Windows helper
    runs-on: windows-latest
    timeout-minutes: 10  # observed max 1.4 min (2 runs, Aug 2026); thin history -> +5; 3x headroom, rounded up to 5
    if: ${{ github.event_name == 'pull_request' || inputs.packages == 'agent-sdk' || inputs.packages == 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # build.ps1 runs `dotnet publish -c Release -r win-x64` (self-contained,
      # single file) and stages the exe into provian-agent-sdk/bin/helpers/win32.
      - name: Build helper (build.ps1 → ProvianForegroundHelper.exe)
        shell: pwsh
        working-directory: provian-agent-sdk/native/win32/foreground-helper
        run: ./build.ps1

      - name: Upload Windows helper artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foreground-helper-win32
          path: provian-agent-sdk/bin/helpers/win32/ProvianForegroundHelper.exe
          if-no-files-found: error
          retention-days: 7

  # ---- Assemble + pack the SDK (verify both binaries land in the tarball) ----
  package:
    name: Pack SDK with bundled helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 1.0 min (1 run, Aug 2026); thin history -> +5; 3x headroom, rounded up to 5
    needs: [build-macos, build-windows]
    if: ${{ github.event_name == 'pull_request' || inputs.packages == 'agent-sdk' || inputs.packages == 'all' }}
    # F44: the sha256 of the exact tarball this job built + verified. The publish job re-hashes
    # the artifact it downloads and refuses to publish unless it matches — so a tampered artifact
    # (or a trojaned action mutating it between download and publish) cannot ship.
    outputs:
      sha256: ${{ steps.tarball_sha.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Download macOS helper
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: foreground-helper-darwin
          path: provian-agent-sdk/bin/helpers/darwin

      - name: Download Windows helper
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: foreground-helper-win32
          path: provian-agent-sdk/bin/helpers/win32

      - name: Unpack macOS .app and clean up tar
        working-directory: provian-agent-sdk/bin/helpers/darwin
        run: |
          tar -xf darwin-helper.tar
          rm -f darwin-helper.tar

      - name: Install + build SDK
        working-directory: provian-agent-sdk
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Pack
        working-directory: provian-agent-sdk
        run: npm pack

      - name: Verify both helpers are inside the tarball
        working-directory: provian-agent-sdk
        run: |
          TARBALL=$(ls provian-agent-sdk-*.tgz)
          echo "Inspecting $TARBALL"
          tar -tzf "$TARBALL" > contents.txt
          grep -q 'package/bin/helpers/darwin/ProvianForegroundHelper.app/Contents/MacOS/ProvianForegroundHelper' contents.txt \
            || { echo "::error::macOS helper missing from tarball"; exit 1; }
          grep -q 'package/bin/helpers/win32/ProvianForegroundHelper.exe' contents.txt \
            || { echo "::error::Windows helper missing from tarball"; exit 1; }
          echo "Both helper binaries present in the tarball."

      - name: Record tarball sha256 (F44 — publish job verifies against this)
        id: tarball_sha
        working-directory: provian-agent-sdk
        run: |
          TARBALL=$(ls provian-agent-sdk-*.tgz)
          SHA=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SDK tarball sha256: $SHA"

      - name: Upload packed tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provian-agent-sdk-tarball
          path: provian-agent-sdk/provian-agent-sdk-*.tgz
          if-no-files-found: error
          retention-days: 14

  # ---- Pack @provian/cli (build against the in-repo SDK; verify dist+bin) ----
  pack-cli:
    name: Pack @provian/cli
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.9 min (3 runs, Aug 2026); thin history -> +5; 3x headroom, rounded up to 5
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.packages == 'cli' || inputs.packages == 'all') }}
    outputs:
      sha256: ${{ steps.tarball_sha.outputs.sha256 }}  # F44: publish-cli verifies against this
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # The CLI imports classifyAction / AgentAction / session helpers from
      # @provian/agent-sdk, whose ^ dep is not on npm at pack time. Build the
      # in-repo SDK and pack it so the CLI can compile against the exact source
      # in this commit (helper binaries are NOT needed just to compile types).
      - name: Build the in-repo agent-sdk so the CLI can compile against it
        working-directory: provian-agent-sdk
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm pack

      # --no-save installs the SDK from the local tarball WITHOUT rewriting the
      # CLI's package.json dep, so the PUBLISHED CLI keeps its "@provian/agent-sdk": "^x"
      # range (end users resolve it from npm). This single install also pulls the
      # CLI's own devDeps; a second `npm install` would 404 on the unpublished SDK.
      - name: Install CLI deps (SDK from local tarball)
        working-directory: provian-cli
        run: |
          SDK_TGZ=$(ls ../provian-agent-sdk/provian-agent-sdk-*.tgz)
          echo "Using local SDK tarball: $SDK_TGZ"
          npm install "$SDK_TGZ" --no-save --no-audit --no-fund

      - name: Build
        working-directory: provian-cli
        run: npm run build

      - name: Pack
        working-directory: provian-cli
        run: npm pack

      - name: Verify tarball (dist + bin present, SDK dep NOT rewritten to file:)
        working-directory: provian-cli
        run: |
          TARBALL=$(ls provian-cli-*.tgz)
          echo "Inspecting $TARBALL"
          tar -tzf "$TARBALL" > contents.txt
          grep -q 'package/dist/index.js' contents.txt \
            || { echo "::error::cli dist/index.js missing from tarball"; exit 1; }
          grep -q 'package/bin/provian.mjs' contents.txt \
            || { echo "::error::cli bin/provian.mjs missing from tarball"; exit 1; }
          tar -xzO -f "$TARBALL" package/package.json | node -e "
            const p = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const dep = (p.dependencies || {})['@provian/agent-sdk'] || '';
            if (dep.startsWith('file:') || dep.startsWith('.') || dep.startsWith('/')) {
              console.error('::error::published CLI ships a local path SDK dep: ' + dep); process.exit(1);
            }
            console.log('CLI publishes @provian/agent-sdk dep =', dep);
          "

      - name: Record tarball sha256 (F44 — publish-cli verifies against this)
        id: tarball_sha
        working-directory: provian-cli
        run: |
          TARBALL=$(ls provian-cli-*.tgz)
          SHA=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "CLI tarball sha256: $SHA"

      - name: Upload cli tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provian-cli-tarball
          path: provian-cli/provian-cli-*.tgz
          if-no-files-found: error
          retention-days: 14

  # ---- Pack @provian/mcp (verify dist+bin + core mirror) ---------------
  pack-mcp:
    name: Pack @provian/mcp
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.5 min (4 runs, Aug 2026); thin history -> +5; 3x headroom, rounded up to 5
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.packages == 'mcp' || inputs.packages == 'all') }}
    outputs:
      sha256: ${{ steps.tarball_sha.outputs.sha256 }}  # F44: publish-mcp verifies against this
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # Byte-identical core mirror gate (the manual §3.4 pre-publish check):
      # the relay's bundled MCP core must match the canonical provian-mcp core.
      - name: Verify MCP core mirror is in sync
        run: bash scripts/check-mcp-core-mirror.sh

      - name: Install + build
        working-directory: provian-mcp
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Pack
        working-directory: provian-mcp
        run: npm pack

      - name: Verify tarball (dist + bin present)
        working-directory: provian-mcp
        run: |
          TARBALL=$(ls provian-mcp-*.tgz)
          echo "Inspecting $TARBALL"
          tar -tzf "$TARBALL" > contents.txt
          grep -q 'package/dist/index.js' contents.txt \
            || { echo "::error::mcp dist/index.js missing from tarball"; exit 1; }
          grep -q 'package/bin/provian-mcp.mjs' contents.txt \
            || { echo "::error::mcp bin/provian-mcp.mjs missing from tarball"; exit 1; }

      - name: Record tarball sha256 (F44 — publish-mcp verifies against this)
        id: tarball_sha
        working-directory: provian-mcp
        run: |
          TARBALL=$(ls provian-mcp-*.tgz)
          SHA=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "MCP tarball sha256: $SHA"

      - name: Upload mcp tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provian-mcp-tarball
          path: provian-mcp/provian-mcp-*.tgz
          if-no-files-found: error
          retention-days: 14

  # ---- Pack @provian/commons (README + licence only; verify the file list) ----
  pack-commons:
    name: Pack @provian/commons
    runs-on: ubuntu-latest
    timeout-minutes: 5  # a README/licence-only pack (no install, no build); same shape as pack-mcp minus the build
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.packages == 'commons' || inputs.packages == 'all') }}
    outputs:
      sha256: ${{ steps.tarball_sha.outputs.sha256 }}  # publish-commons verifies against this
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Pack
        working-directory: provian-commons
        run: npm pack

      - name: Verify tarball (README, LICENSE and package.json present; no code)
        working-directory: provian-commons
        run: |
          TARBALL=$(ls provian-commons-*.tgz)
          echo "Inspecting $TARBALL"
          tar -tzf "$TARBALL" > contents.txt
          cat contents.txt
          for f in package/package.json package/README.md package/LICENSE; do
            grep -qx "$f" contents.txt || { echo "::error::$f missing from tarball"; exit 1; }
          done
          if grep -E '\.(js|mjs|cjs|ts)$' contents.txt; then echo "::error::code in the commons tarball"; exit 1; fi

      - name: Record tarball sha256 (publish-commons verifies against this)
        id: tarball_sha
        working-directory: provian-commons
        run: |
          TARBALL=$(ls provian-commons-*.tgz)
          SHA=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Commons tarball sha256: $SHA"

      - name: Upload commons tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provian-commons-tarball
          path: provian-commons/provian-commons-*.tgz
          if-no-files-found: error
          retention-days: 14

  # ---- Publish @provian/agent-sdk (manual, opt-in, off by default) -----
  publish:
    name: Publish @provian/agent-sdk to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.4 min (1 run, Aug 2026); thin history -> +5; 3x headroom, rounded up to 5
    needs: package
    # Only on a manual run with publish=true targeting the SDK. Never on PRs.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && (inputs.packages == 'agent-sdk' || inputs.packages == 'all') }}
    # Add a required-reviewer protection rule to this environment in repo
    # settings for an extra manual approval gate before anything publishes.
    environment: npm-publish
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download packed tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provian-agent-sdk-tarball
          path: .

      # F44: refuse to publish unless the downloaded tarball hashes to the exact value the
      # package job printed. Guards against a tampered artifact store or a trojaned action
      # mutating the bytes between pack and publish.
      - name: Verify tarball sha256 matches the packed value
        run: |
          EXPECTED='${{ needs.package.outputs.sha256 }}'
          TARBALL=$(ls provian-agent-sdk-*.tgz)
          ACTUAL=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          if [ -z "$EXPECTED" ]; then echo "::error::no expected sha256 from the package job"; exit 1; fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then echo "::error::tarball sha256 mismatch — refusing to publish"; exit 1; fi

      # Publishes the exact tarball that the package job built and verified,
      # so what ships is what was tested. Requires the NPM_TOKEN secret to be
      # configured; without it this step fails and nothing is published.
      - name: Publish
        run: npm publish provian-agent-sdk-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---- Publish @provian/cli (manual, opt-in) --------------------------
  publish-cli:
    name: Publish @provian/cli to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.2 min (2 runs, Aug 2026); thin history -> +5; 3x headroom, rounded up to 5
    needs: [pack-cli, publish]
    # Publish the exact verified CLI tarball. In 'all' mode this waits for the
    # SDK publish to SUCCEED first (so the CLI's ^ dep resolves for end users);
    # in 'cli' mode the SDK publish is skipped and that is allowed.
    if: >-
      ${{ always()
      && github.event_name == 'workflow_dispatch' && inputs.publish == true
      && (inputs.packages == 'cli' || inputs.packages == 'all')
      && needs['pack-cli'].result == 'success'
      && (needs['publish'].result == 'success' || needs['publish'].result == 'skipped') }}
    environment: npm-publish
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download packed cli tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provian-cli-tarball
          path: .

      - name: Verify tarball sha256 matches the packed value (F44)
        run: |
          EXPECTED='${{ needs.pack-cli.outputs.sha256 }}'
          TARBALL=$(ls provian-cli-*.tgz)
          ACTUAL=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          if [ -z "$EXPECTED" ]; then echo "::error::no expected sha256 from the pack-cli job"; exit 1; fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then echo "::error::tarball sha256 mismatch — refusing to publish"; exit 1; fi

      - name: Publish
        run: npm publish provian-cli-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---- Publish @provian/mcp (manual, opt-in) --------------------------
  publish-mcp:
    name: Publish @provian/mcp to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.2 min (2 runs, Aug 2026); thin history -> +5; 3x headroom, rounded up to 5
    needs: [pack-mcp, publish-cli]
    # In 'all' mode this runs after the CLI publish; in 'mcp' mode the CLI
    # publish is skipped and that is allowed (mcp has no SDK/CLI dependency).
    if: >-
      ${{ always()
      && github.event_name == 'workflow_dispatch' && inputs.publish == true
      && (inputs.packages == 'mcp' || inputs.packages == 'all')
      && needs['pack-mcp'].result == 'success'
      && (needs['publish-cli'].result == 'success' || needs['publish-cli'].result == 'skipped') }}
    environment: npm-publish
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download packed mcp tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provian-mcp-tarball
          path: .

      - name: Verify tarball sha256 matches the packed value (F44)
        run: |
          EXPECTED='${{ needs.pack-mcp.outputs.sha256 }}'
          TARBALL=$(ls provian-mcp-*.tgz)
          ACTUAL=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          if [ -z "$EXPECTED" ]; then echo "::error::no expected sha256 from the pack-mcp job"; exit 1; fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then echo "::error::tarball sha256 mismatch — refusing to publish"; exit 1; fi

      - name: Publish
        run: npm publish provian-mcp-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---- Publish @provian/commons (manual, opt-in) ----------------------
  publish-commons:
    name: Publish @provian/commons to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10  # same shape as publish-mcp (observed max 0.2 min); 3x headroom, rounded up to 5
    needs: [pack-commons, publish-mcp]
    # In 'all' mode this runs after the mcp publish; in 'commons' mode the npm
    # publishes before it are skipped and that is allowed (no npm dependency).
    if: >-
      ${{ always()
      && github.event_name == 'workflow_dispatch' && inputs.publish == true
      && (inputs.packages == 'commons' || inputs.packages == 'all')
      && needs['pack-commons'].result == 'success'
      && (needs['publish-mcp'].result == 'success' || needs['publish-mcp'].result == 'skipped') }}
    environment: npm-publish
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download packed commons tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provian-commons-tarball
          path: .

      - name: Verify tarball sha256 matches the packed value
        run: |
          EXPECTED='${{ needs.pack-commons.outputs.sha256 }}'
          TARBALL=$(ls provian-commons-*.tgz)
          ACTUAL=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          if [ -z "$EXPECTED" ]; then echo "::error::no expected sha256 from the pack-commons job"; exit 1; fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then echo "::error::tarball sha256 mismatch — refusing to publish"; exit 1; fi

      - name: Publish
        run: npm publish provian-commons-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---- Pack provian-sdk for PyPI (build sdist+wheel, twine check, scratch install) ----
  pack-pypi:
    name: Pack provian-sdk (PyPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.5 min (2 runs, Aug 2026); thin history -> +5; 3x headroom, rounded up to 5
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.packages == 'pypi' || inputs.packages == 'all') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install build + twine
        run: python -m pip install --upgrade build twine

      # Build BOTH distributions from provian-python-sdk/pyproject.toml
      # (name = "provian-sdk"), so the sdist and the wheel are the exact
      # artifacts publish-pypi later uploads — what ships is what was checked.
      - name: Build sdist + wheel
        working-directory: provian-python-sdk
        run: python -m build

      # twine check validates the package metadata + long-description render;
      # a bad README would otherwise only fail AFTER the upload on PyPI.
      - name: twine check
        working-directory: provian-python-sdk
        run: twine check dist/*

      # Scratch install the freshly built wheel into a throwaway venv and import
      # the package. This is the PyPI analogue of the npm jobs' tarball-contents
      # grep: proof the distribution is installable and importable before publish.
      - name: Verify the built wheel installs + imports in a scratch venv
        working-directory: provian-python-sdk
        run: |
          python -m venv /tmp/pyverify
          WHEEL=$(ls dist/*.whl)
          echo "Installing $WHEEL into a scratch venv"
          /tmp/pyverify/bin/pip install --quiet "$WHEEL"
          /tmp/pyverify/bin/python -c "import provian; print('provian', provian.__version__)"

      - name: Upload PyPI dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provian-sdk-pypi-dist
          path: provian-python-sdk/dist/*
          if-no-files-found: error
          retention-days: 14

  # ---- Publish provian-sdk to PyPI (manual, opt-in, OIDC trusted publishing) --
  publish-pypi:
    name: Publish provian-sdk to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.4 min (1 run, Aug 2026); thin history -> +5; 3x headroom, rounded up to 5
    needs: [pack-pypi, publish-commons]
    # PyPI is last in the locked order (agent-sdk -> cli -> mcp -> commons -> PyPI).
    # In 'all' mode this waits for the commons publish to SUCCEED first; in 'pypi' mode
    # the npm publishes are skipped and that is allowed (provian-sdk has no npm
    # dependency, so it need not wait on them).
    if: >-
      ${{ always()
      && github.event_name == 'workflow_dispatch' && inputs.publish == true
      && (inputs.packages == 'pypi' || inputs.packages == 'all')
      && needs['pack-pypi'].result == 'success'
      && (needs['publish-commons'].result == 'success' || needs['publish-commons'].result == 'skipped') }}
    environment: pypi-publish
    # OIDC trusted publishing: id-token: write lets the runner mint a short-lived
    # OIDC token that PyPI trades for an upload scope. No API token, no secret.
    permissions:
      id-token: write
    steps:
      - name: Download PyPI dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provian-sdk-pypi-dist
          path: dist

      # Uploads dist/* (the exact sdist + wheel pack-pypi built and verified).
      # Auth is OIDC — this repo + this workflow + the pypi-publish environment
      # must be registered as a Trusted Publisher on the PyPI project first.
      - name: Publish to PyPI (OIDC trusted publishing, no token)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
