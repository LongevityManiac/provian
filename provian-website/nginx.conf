# Sized for the review-open maps' long $uri keys (see below). Must precede the
# first map block.
map_hash_bucket_size 256;
map_hash_max_size 8192;

# ── llms.txt Genesis switch (http context) ─────────────────────────────
# This file is copied to /etc/nginx/conf.d/default.conf (see Dockerfile), which
# the stock nginx.conf includes inside its `http {}` block, so a top-level
# `map` here is legal. scripts/sync-docs.mjs writes two variants of each agent
# index: public/llms.txt / llms-full.txt lead with the Genesis line ("Genesis
# is open through December 31, 2026: ..."), and llms.post-genesis.txt /
# llms-full.post-genesis.txt omit it. The server clock picks the variant, so
# the line comes off at the close of the Genesis window (2027-01-01T00:00:00Z)
# with no deploy. $time_iso8601 is local time in the container, which is UTC on
# Cloud Run; any year 2027 or later selects the post-Genesis files.
map $time_iso8601 $llms_variant {
    default "";
    "~^(202[7-9]|20[3-9][0-9])" ".post-genesis";
}

# ── Store-review open set (the review-open switch, OFF by default) ─────
# The image build writes /etc/nginx/review-open/*.map from review-open.json
# (scripts/review-open.mjs; Dockerfile ARG REVIEW_OPEN, set by
# `scripts/deploy-site.sh --review-open`). Switch OFF: the maps hold no entries,
# so the realm is "Provian Preview" for every URL, no file is substituted and
# nothing redirects: exactly the walled site. Switch ON: the URLs the app opens
# or shares, the store records' URLs, and exactly the files those pages load
# evaluate the realm to "off", which auth_basic treats as no password; every
# other URL keeps the wall. Keys are $uri (decoded and normalized, no query).
# (map_hash_* at the top of this file size the hash for those long keys.)
map $uri $provian_auth_realm {
    default "Provian Preview";
    include /etc/nginx/review-open/auth.map;
}
map $uri $provian_review_file {
    default "";
    include /etc/nginx/review-open/files.map;
}
map $uri $provian_review_redirect {
    default "";
    include /etc/nginx/review-open/redirect.map;
}
# The switch itself: mode.map holds only `default 0;` (OFF) or `default 1;` (ON).
map $uri $provian_review_on {
    include /etc/nginx/review-open/mode.map;
}
# Switch ON only: the open Next pages' client router prefetches the RSC payload
# (`RSC: 1` request header) of every page they link to. A walled target answers
# 401 either way, but a 401 carrying the Basic-Auth challenge makes the browser
# pop a password prompt on an open page the visitor never asked to leave. So an
# RSC request without credentials for a walled URL gets a bare 401 (no
# challenge); a click on that link then falls back to a full page load, which
# meets the wall (and its prompt) as any walled URL does.
map "$provian_review_on:$provian_auth_realm:$http_rsc:$remote_user" $provian_rsc_bare_401 {
    default 0;
    "1:Provian Preview:1:" 1;
}

# ── Trailing-slash canonicalisation (see `location /`) ─────────────────
# Only a URI that does NOT already end in "/" gets a candidate file to test;
# otherwise the candidate is empty, $document_root alone is a directory, and
# the -f test is false (so /x/ can never redirect to /x//).
map $uri $provian_slash_candidate {
    default   "";
    "~[^/]$"  "$uri/index.html";
}

# ── Edge caching (Cloudflare in front, 2026-10-11) ─────────────────────
# Cloudflare caches only what this header says it may (its cache rule respects
# the origin and bypasses anything without a Cache-Control). A response is
# shareable only when the request carried no credentials: $remote_user is the
# Basic-Auth user named in the request's Authorization header, verified or not,
# so a request that sends credentials can never seed a shared cache entry, and
# a gated page (401 to everyone without credentials) is never cached either.
# Pre-launch that leaves only the public carve-outs cacheable; at the LAUNCH
# FLIP the whole site becomes cacheable with no edit here.
#   /_next/static/*  content-hashed: a year, immutable
#   films (.mp4)     a day at the edge (they are the heavy bytes)
#   everything else  60 s at the edge
# A request with credentials gets the same lifetimes, marked private: only the
# visitor's own browser may keep it. A 401 is never stored anywhere.
# Browsers revalidate everything but /_next/static on each visit, and the
# website deploy purges Cloudflare's cache (scripts/deploy-site.sh), so a
# redeploy shows at once; the edge times bound staleness if a purge is missed.
map $remote_user $provian_shared {
    ""      1;
    default 0;
}
map "$provian_shared:$status:$uri" $provian_cache_control {
    default                                  "private, no-store";
    "~^1:200:/_next/static/"                 "public, max-age=31536000, immutable";
    "~^0:200:/_next/static/"                 "private, max-age=31536000, immutable";
    "~^1:(200|206):.*\.mp4$"                "public, max-age=0, must-revalidate, s-maxage=86400";
    "~^1:(200|206|301|302|404):"             "public, max-age=0, must-revalidate, s-maxage=60";
    "~^0:(200|206|301|302|404):"             "private, no-cache";
}

server {
    listen 8080;
    # Cloud Run talks to this container over cleartext HTTP/2 (h2c; deploy-site.sh
    # deploys with --use-http2). Over HTTP/1 Cloud Run answers 500 for any
    # response over 32 MiB that carries a Content-Length, which broke the 39 MB
    # To The Stars film for every request, byte ranges included. HTTP/2 has no
    # such limit and keeps ranges, which Safari needs to play video.
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Issue relative redirects so trailing-slash redirects don't leak
    # the upstream port (8080) or downgrade scheme to http. Cloud Run's
    # load balancer terminates TLS in front of us and rewrites to https.
    absolute_redirect off;

    # Pre-launch lockdown headers (defence-in-depth - robots.txt is advisory).
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $provian_cache_control always;

    # ── GLOBAL AUTH WALL ─────────────────────────────────────────────────
    # The ENTIRE site is behind Basic Auth until the launch flip. This is set
    # once at the server level so it is inherited by every location, including
    # /_next/static/* (the static JS/CSS chunks), the splash, images, and every
    # staged /preview route. The only public carve-outs are /.well-known/ and
    # the SELF-CONTAINED pages generated by scripts/build-public-legal.mjs
    # (both below). Nothing under /_next/ is public, except, with the
    # review-open switch ON, exactly the files the open set's Next pages load
    # (listed one by one in the generated auth map; no prefix under /_next/).
    #
    # Why a global wall instead of a positive allowlist: the prior allowlist
    # served /_next/static/*, /, images, /vision, and /support WITHOUT auth,
    # which meant any static chunk (and anything statically bundled into one)
    # was reachable unauthenticated (OPEN_ITEMS.md launch-blocker sweep). A
    # single server-level auth_basic closes that class of hole by construction:
    # a location can only become public by explicitly opting out with
    # `auth_basic off`, and only the deliberate carve-outs below do.
    #
    # LAUNCH FLIP: to go public, drop these two directives (and lift the
    # noindex headers above + in layout.tsx). See the LAUNCH FLIP checklist in
    # OPEN_ITEMS.md for the exact ordered procedure.
    #
    # The realm comes from the review-open map at the top of this file: the
    # literal "Provian Preview" for every URL unless the review-open switch is
    # ON and the URL is in the store-review open set, where it is "off".

    # Review-open switch ON only: the set's redirects (e.g. /earn -> the manual).
    # The map is empty with the switch OFF, so this never fires.
    if ($provian_review_redirect) {
        return 301 $provian_review_redirect;
    }
    # Review-open switch ON only: see $provian_rsc_bare_401 at the top.
    if ($provian_rsc_bare_401) {
        return 401;
    }

    # ── PUBLIC CARVE-OUT: /.well-known/ ──────────────────────────────────
    # Platform association files MUST be fetchable without auth: Apple's CDN
    # (apple-app-site-association, for iOS universal links) and Google
    # (assetlinks.json, for Android App Links) cannot present credentials.
    # Both are public-safe (bundle id + team id + cert fingerprint only).
    # The AASA file is served with no extension, so nginx would fall back to
    # octet-stream without an explicit type; Apple requires application/json.
    # `^~` makes this prefix win over the catch-all so it is never re-gated.
    location ^~ /.well-known/ {
        auth_basic off;
        default_type application/json;
        try_files $uri =404;
    }

    # ── NOT YET PUBLIC: the MCP Registry domain proof (launch listings, 2026-10-07) ──
    # /.well-known/mcp-registry-auth proves provian.ai to registry.modelcontextprotocol.io so
    # the hosted /mcp lists under Provian's own name (`ai.provian/mcp`). the operator’s sequencing:
    # nothing new goes public before go, so it is served only once the site opens. This exact
    # match beats the `^~ /.well-known/` carve-out above and sets no `auth_basic` of its own, so
    # it INHERITS the global wall: 401 now, public the moment the LAUNCH FLIP drops the two
    # server-level directives. Leave it as it is at the flip (no edit needed); the registry
    # refuses redirects, so it must keep answering 200 at exactly this path.
    location = /.well-known/mcp-registry-auth {
        default_type text/plain;
        try_files $uri =404;
    }

    # ── PUBLIC CARVE-OUT: /privacy, /terms, /home, /daemon  ──────
    # Google's OAuth verification for the sensitive `drive.appdata` scope (the
    # Android encrypted-backup path) requires a publicly reachable homepage and
    # privacy policy on the verified domain. The reviewer cannot present Basic
    # Auth credentials, so those pages are carved out.
    #
    # WHAT MAKES THIS SAFE, given the allowlist hole this wall was built to
    # close: every carved-out page is a SELF-CONTAINED static file generated by
    # `scripts/build-public-legal.mjs` — no `/_next/*`, no stylesheet, script,
    # font, or image; inline CSS only. That generator FAILS THE BUILD on any
    # external reference, so the carve-out cannot drift back into serving
    # chunks. Nothing under /_next/ is public, and no Next-rendered page is
    # public. A page that cannot load a chunk cannot leak one.
    #
    # `/privacy` therefore serves the SELF-CONTAINED render, not the Next route.
    # Both render `src/content/legal/privacy.md` — the vendored byte-identical
    # copy of canonical `docs/legal/privacy-policy.md` — so there is one source
    # of legal text, not two. The root `/` splash stays behind the wall; the
    # public homepage lives at `/home` precisely so `/` is not un-walled.
    #
    # The noindex/Referrer-Policy headers above still apply (server-level,
    # `always`), and each page also carries its own noindex meta.
    #
    # LAUNCH FLIP: delete these eight locations. The Next-rendered /privacy,
    # /terms, and /daemon take over automatically once the global wall drops;
    # /home may 301 to /.
    # /terms joined at brand verification's form takes a terms-of-service
    # URL beside the privacy policy. Optional to supply, but a URL entered there
    # must resolve publicly, so it is carved out rather than left to bounce.
    # /daemon joined at  (B7): the app's Earn tab links to
    # https://provian.ai/daemon for desktop-daemon setup, and that link must
    # resolve for users who never hold preview credentials. Same pattern: the
    # self-contained render is generated from `src/content/daemon.ts`, the SAME
    # copy module the Next route renders, so the two cannot drift.
    location = /home { return 301 /; }
    location = /home/ { return 301 /; }

    # Splash page (and Next.js's static-export fallbacks). Auth-gated pre-launch.
    # $provian_review_file (here and below) is empty unless the review-open
    # switch is ON and the URL is a page of the open set, which then serves its
    # self-contained render; an empty first try_files entry is skipped.
    location = / {
        try_files $provian_review_file /index.html =404;
    }

    # /atlas is a REAL page (the founding agent's own page: his statement, his
    # live history, the authorship disclosure). The 301 -> /about/ that used to
    # live here is gone; the Next route serves /atlas/ itself.

    # ── Prior paths (301) ────────────────────────────────────────────────
    # Vision moved /overview -> /vision and the Foundation page became /ubp
    # (Universal Basic Participation leads; the Foundation is its mechanism).
    # The two agents pages merged into the root /agents. Both the staged
    # (/preview/…) and the post-flip root forms are redirected, so a link saved
    # at any point keeps resolving. Anchors (#growth, #foundation) survive a
    # redirect in the browser.
    location = /preview/overview    { return 301 /vision/; }
    location = /preview/overview/   { return 301 /vision/; }
    location = /preview/foundation  { return 301 /ubp/; }
    location = /preview/foundation/ { return 301 /ubp/; }
    location = /preview/agents      { return 301 /agents/; }
    location = /preview/agents/     { return 301 /agents/; }
    location = /overview            { return 301 /vision/; }
    location = /overview/           { return 301 /vision/; }
    location = /foundation          { return 301 /ubp/; }
    location = /foundation/         { return 301 /ubp/; }

    # /developers is a REAL page again (launch channel G7): the framework-
    # agnostic developer landing at src/app/preview/developers, with /blog
    # beside it. The  301 -> /agents/ that used to live here is gone; at
    # the launch flip (BASE='') the Next route serves /developers/ itself, and
    # pre-flip the staged copy is /preview/developers/ behind the wall like
    # every other section.

    # ── /p/* — promise share-link web fallback ───────────────────────────
    # Shared promise links are https://provian.ai/p?d=<ciphertext>#k=<key>.
    # On a device WITH the app + a valid association (assetlinks.json /
    # apple-app-site-association) the OS opens the app directly and never hits
    # this page. Everyone else (no app, or a desktop browser) lands here: a
    # single static "open this promise in Provian" page with platform-aware
    # get-the-app buttons. The promise itself is end-to-end encrypted in the
    # URL fragment and is NEVER decrypted server-side, so a generic landing is
    # the only correct behaviour — the same page serves /p and any /p/<id>.
    # Replaces the old catch-all 404 that dead-ended every shared link.
    location = /p       { try_files $provian_review_file /p/index.html =404; }
    location ^~ /p/     { try_files $provian_review_file /p/index.html =404; }

    # ── /a/* — public agent record (Agent Passport) ──────────────────────
    # /a/<agentId> renders GET api.provian.ai/v1/agents/:id/record client-side.
    # Same single-page pattern as /p: the static export cannot enumerate agent
    # ids at build time, so one client page reads the id from the path and the
    # same page serves /a and any /a/<id>. Auth-gated pre-launch like the rest
    # of the site; public at flip when the global wall drops.
    location = /a       { try_files /a/index.html =404; }
    location ^~ /a/     { try_files /a/index.html =404; }

    # ── /proposals — public earning-type registry ────────────────────────
    # Renders GET api.provian.ai/v1/pe/earning-proposals client-side: every
    # action type the network has seen, with a live/building/queued/declined
    # status from the SERVED matrix + rulings sidecar. Single client page like
    # /a; the projection is fetched at view time, never enumerated at build.
    # Auth-gated pre-launch like the rest of the site; public at flip when the
    # global wall drops (and the backend surface gate opens the read —
    # decision 5). trailingSlash export emits /proposals/index.html.
    location = /proposals  { try_files /proposals/index.html =404; }
    location = /proposals/ { try_files /proposals/index.html =404; }

    # Stable contributor links (exact-match, so the bare forms serve without a redirect).
    location = /gates { try_files /gates/index.html =404; }
    location = /gates/ { try_files /gates/index.html =404; }
    location = /library/contributing { try_files /library/contributing/index.html =404; }
    location = /library/contributing/ { try_files /library/contributing/index.html =404; }

    # llms.txt / llms-full.txt - the agent-readable index over the docs-md
    # mirror (generated by scripts/sync-docs.mjs). mime.types already maps
    # .txt to text/plain; declare UTF-8 explicitly since the files contain
    # non-ASCII typography. Behind the global wall pre-flip, public at flip.
    # The Genesis/post-Genesis variant is chosen by the $llms_variant map at
    # the top of this file.
    location = /llms.txt {
        charset utf-8;
        charset_types text/plain;
        try_files /llms$llms_variant.txt =404;
    }
    location = /llms-full.txt {
        charset utf-8;
        charset_types text/plain;
        try_files /llms-full$llms_variant.txt =404;
    }

    # LAUNCH FLIP (films on R2): once FILM_MEDIA_BASE in src/lib/genesis.ts
    # points at https://media.provian.ai and that R2 custom domain is enabled,
    # uncomment this so links that already name provian.ai/films/<film>.mp4
    # (the app's) stream from R2 too. The /films/<slug>/ watch pages and the
    # posters stay here.
    location ~ ^/films/[a-z0-9-]+\.mp4$ {
        return 301 https://media.provian.ai$request_uri;
    }

    # Send bookmarks and legacy app links to Google Play.
    location ~ ^/download/android/?$ {
        return 301 https://play.google.com/store/apps/details?id=com.provian.wallet;
    }

    location ~* \.apk$ {
        return 410;
    }

    # /docs-md - raw markdown sources for the Library (agents fetch these, and
    # the Library "Raw markdown" buttons link here). .md is absent from nginx's
    # default mime.types, so without default_type it would download as
    # octet-stream. Auth-gated like the Library that references it.
    location ^~ /docs-md/ {
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        try_files $uri =404;
    }

    # Everything else: serve the static export for authed users, 404 for
    # unknown paths (no directory listing, no fall-through). This covers the
    # whole Next.js export — /_next/static/*, /preview/*, /download, /about,
    # images — all behind the global auth wall. (The Next-rendered /privacy,
    # /terms, and /daemon pages sit in the export too, but the exact-match
    # carve-outs above shadow those URLs with the self-contained renders until
    # the flip.)
    location / {
        # One URL per page: a no-slash path whose slash form exists in the
        # export (/library/x -> /library/x/) answers 301 instead of serving the
        # same page at two URLs (Search Console: "Duplicate without
        # user-selected canonical").
        if (-f $document_root$provian_slash_candidate) {
            return 301 $uri/$is_args$args;
        }
        try_files $provian_review_file $uri $uri/index.html =404;
    }
}
