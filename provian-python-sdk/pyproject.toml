[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provian-sdk"
version = "0.4.0"
description = "Python SDK for the Provian Network - the trust layer for the AI agent economy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Provian", email = "sdk@provian.ai" },
]
keywords = ["provian", "ai-agents", "provenance", "pvt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
    # x25519 + ChaCha20-Poly1305 for the sealed copy of each PE to its owner (provian.sealed_box).
    "cryptography>=41.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://provian.ai"
Documentation = "https://provian.ai/developers"
Support = "https://provian.ai/support"

[tool.setuptools.packages.find]
include = ["provian*"]

[tool.pytest.ini_options]
# Report every skip, so a missing oracle never passes silently.
addopts = "-rs"
